name: Pages

on:
  push:
    branches: [main]
    paths:
      - "public/briefing/**"
      - "src/lib/data/digest-*.ts"
      - "scripts/build-pages.mjs"
      - ".github/workflows/pages.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static briefing
        run: node scripts/build-pages.mjs
      - name: Enable GitHub Pages with Actions as source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "current Pages config:"
          gh api repos/${{ github.repository }}/pages || true
          gh api --method POST repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow && echo "created Pages site (workflow)"
          gh api --method PUT repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow && echo "switched Pages source to workflow"
          echo "Pages config after enable:"
          gh api repos/${{ github.repository }}/pages || true
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
